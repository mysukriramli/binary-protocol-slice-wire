name: Binary Protocol Slice Engine

on:
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: protocol-slice-compile
  cancel-in-progress: true

jobs:
  slice-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/binary_slices.db
          key: binary-slices-db-${{ github.run_id }}
          restore-keys: |
            binary-slices-db-

      - name: Execute Binary Protocol Slice Engine
        run: python slice_engine.py

      - name: Commit Schema Deltas and Parquet Ledger
        run: |
          git config user.name "slice-bot[bot]"
          git config user.email "slice-bot@users.noreply.github.com"

          # Stage ledger, parquet, and public updates
          git add ledger/ data/fields.parquet public/

          if git diff --staged --quiet; then
            echo "No protocol slice deltas detected."
          else
            git commit -m "chore(slices): record protocol slices and discriminant mappings [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
